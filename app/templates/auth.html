<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication & RBAC Portal - AI Document Inspector</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/glassmorphism.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary);">
    <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.5rem; text-align: center;">
        <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">⚡</div>
        <h2 style="font-size: 1.5rem; font-weight: 800;">AI DOCUMENT INSPECTOR</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem;">Sign in to access document inspection, review workflows, and reports</p>

        <!-- Fast Demo Fill -->
        <div style="background: rgba(0,0,0,0.2); border-radius: var(--radius-md); padding: 0.8rem; margin-bottom: 1.5rem;">
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 700;">FAST DEMO LOGIN:</div>
            <div style="display: flex; gap: 0.4rem; justify-content: center;">
                <button class="btn btn-secondary btn-sm" onclick="demoLogin('admin', 'AdminPass2026!')">👑 Admin</button>
                <button class="btn btn-primary btn-sm" onclick="demoLogin('analyst', 'AnalystPass2026!')">🔍 Analyst</button>
                <button class="btn btn-secondary btn-sm" onclick="demoLogin('viewer', 'ViewerPass2026!')">👁️ Viewer</button>
            </div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
            <div>
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">Username or Email</label>
                <input id="authUsername" type="text" required style="width: 100%; padding: 0.75rem; background: var(--bg-tertiary); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: var(--text-primary); margin-top: 0.3rem;">
            </div>
            <div>
                <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">Password</label>
                <input id="authPassword" type="password" required style="width: 100%; padding: 0.75rem; background: var(--bg-tertiary); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: var(--text-primary); margin-top: 0.3rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem; padding: 0.85rem;">Sign In</button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        function demoLogin(u, p) {
            document.getElementById("authUsername").value = u;
            document.getElementById("authPassword").value = p;
            document.getElementById("loginForm").dispatchEvent(new Event('submit'));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("authUsername").value;
            const p = document.getElementById("authPassword").value;

            try {
                const res = await App.request("/api/auth/login", {
                    method: "POST",
                    body: JSON.stringify({ username: u, password: p })
                });
                App.setAuth(res.data.user, res.data.token);
                App.showToast(`Welcome back, ${res.data.user.full_name}!`, "success");
                setTimeout(() => window.location.href = "/dashboard", 600);
            } catch(err) {
                App.showToast(err.message, "error");
            }
        }
    </script>
</body>
</html>
