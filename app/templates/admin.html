<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration & Governance - AI Document Inspector</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/glassmorphism.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-brand">
            <span>⚡ AI DOCUMENT INSPECTOR</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/inspect" class="nav-link">Inspection Studio</a>
            <a href="/issues" class="nav-link">Issue Center</a>
            <a href="/documents" class="nav-link">Library</a>
            <a href="/admin" class="nav-link active">Admin</a>
            <button class="btn btn-secondary btn-sm" onclick="App.toggleTheme()">🌓 Theme</button>
            <div id="navAuthBox"></div>
        </nav>
    </header>

    <main class="dashboard-container">
        <div style="margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.75rem; font-weight: 800;">Administration & Audit Governance</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Manage user accounts, RBAC roles, audit logs, and validation rules.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <!-- User Management -->
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem;">User Accounts & RBAC</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

            <!-- Audit Logs -->
            <div class="glass-panel" style="padding: 1.5rem;">
                <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem;">Immutable Audit Trail</h3>
                <div id="auditLogsContainer" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem;"></div>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        async function loadAdminData() {
            try {
                const userRes = await App.request("/api/admin/users");
                const tbody = document.getElementById("usersTableBody");
                tbody.innerHTML = "";
                (userRes.data.users || []).forEach(u => {
                    const tr = document.createElement("tr");
                    const rBadge = u.role === 'ADMIN' ? 'badge-danger' : u.role === 'ANALYST' ? 'badge-purple' : 'badge-info';
                    tr.innerHTML = `<td><strong>${u.username}</strong><br><small style="color:var(--text-secondary);">${u.email}</small></td><td><span class="badge ${rBadge}">${u.role}</span></td><td><span class="badge badge-success">Active</span></td>`;
                    tbody.appendChild(tr);
                });

                const logRes = await App.request("/api/audit/logs");
                const logBox = document.getElementById("auditLogsContainer");
                logBox.innerHTML = "";
                (logRes.data.logs || []).forEach(l => {
                    const item = document.createElement("div");
                    item.className = "glass-panel";
                    item.style.cssText = "padding: 8px 12px; font-size: 12px; border-left: 3px solid var(--accent-cyan);";
                    item.innerHTML = `<strong>[${l.action}]</strong> by <em>${l.username}</em> &bull; Target: ${l.target} &bull; <span style="color:#34d399;">${l.result}</span>`;
                    logBox.appendChild(item);
                });
            } catch(e) {
                App.showToast(e.message, "error");
            }
        }
        document.addEventListener("DOMContentLoaded", loadAdminData);
    </script>
</body>
</html>
