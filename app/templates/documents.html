<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Library - AI Document Inspector</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/glassmorphism.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-brand">
            <span>⚡ AI DOCUMENT INSPECTOR</span>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/inspect" class="nav-link">Inspection Studio</a>
            <a href="/issues" class="nav-link">Issue Center</a>
            <a href="/data-quality" class="nav-link">Data Quality</a>
            <a href="/documents" class="nav-link active">Library</a>
            <a href="/compare" class="nav-link">Compare</a>
            <a href="/chat" class="nav-link">AI Assistant</a>
            <a href="/compliance" class="nav-link">Compliance</a>
            <button class="btn btn-secondary btn-sm" onclick="App.toggleTheme()">🌓 Theme</button>
            <div id="navAuthBox"></div>
        </nav>
    </header>

    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <h2 style="font-size: 1.75rem; font-weight: 800;">Enterprise Document Library</h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Catalog, version history, search, and document management.</p>
            </div>
            <a href="/inspect" class="btn btn-primary">⚡ Ingest Document</a>
        </div>

        <div class="glass-panel" style="padding: 1.5rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1.2rem;">
                <input id="docSearch" type="text" placeholder="Search documents by name, tags, or folder..." style="padding: 0.6rem 1rem; width: 350px; background: var(--bg-tertiary); border: 1px solid var(--border-glass); border-radius: var(--radius-md); color: var(--text-primary);" oninput="loadDocs()">
                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary btn-sm" onclick="loadDocs(0)">Active Documents</button>
                    <button class="btn btn-secondary btn-sm" onclick="loadDocs(1)">Archived</button>
                </div>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Document Name</th>
                        <th>Type</th>
                        <th>Size</th>
                        <th>Health Score</th>
                        <th>Risk Level</th>
                        <th>Version</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="docsTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        async function loadDocs(archived = 0) {
            const search = document.getElementById("docSearch").value;
            try {
                const res = await App.request(`/api/documents/list?search=${encodeURIComponent(search)}&archived=${archived}`);
                const docs = res.data.documents || [];
                const tbody = document.getElementById("docsTableBody");
                tbody.innerHTML = "";

                if (docs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No documents found. <a href="/inspect" style="color: var(--accent-cyan);">Upload or inspect a document</a></td></tr>`;
                    return;
                }

                docs.forEach(d => {
                    const tr = document.createElement("tr");
                    const riskBadge = d.risk_level === 'CRITICAL' ? 'badge-danger' : d.risk_level === 'HIGH' ? 'badge-warning' : 'badge-success';
                    tr.innerHTML = `
                        <td><strong>${App.escapeHtml(d.original_name)}</strong></td>
                        <td><span class="badge badge-purple">${d.file_type.toUpperCase()}</span></td>
                        <td>${Math.round(d.file_size / 1024)} KB</td>
                        <td><strong>${d.health_score || 85}/100</strong></td>
                        <td><span class="badge ${riskBadge}">${d.risk_level}</span></td>
                        <td>v${d.version || 1}</td>
                        <td style="display: flex; gap: 0.4rem;">
                            <a href="/inspect?id=${d.id}" class="btn btn-primary btn-sm">Inspect</a>
                            <button class="btn btn-secondary btn-sm" onclick="archiveDoc('${d.id}', ${archived === 0})">${archived === 0 ? 'Archive' : 'Restore'}</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDoc('${d.id}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                App.showToast(e.message, "error");
            }
        }

        async function deleteDoc(id) {
            if (!confirm("Are you sure you want to delete this document?")) return;
            try {
                await App.request("/api/documents/delete", { method: "POST", body: JSON.stringify({ id }) });
                App.showToast("Document deleted.", "info");
                loadDocs();
            } catch(e) {
                App.showToast(e.message, "error");
            }
        }

        async function archiveDoc(id, arch) {
            try {
                await App.request("/api/documents/archive", { method: "POST", body: JSON.stringify({ id, archive: arch }) });
                App.showToast(arch ? "Document archived." : "Document restored.", "success");
                loadDocs();
            } catch(e) {
                App.showToast(e.message, "error");
            }
        }

        document.addEventListener("DOMContentLoaded", () => loadDocs(0));
    </script>
</body>
</html>
